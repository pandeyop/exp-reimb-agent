# Render Blueprint: one free Docker Web Service serving the API and the React UI.
# Step-by-step setup and verification: docs/DEPLOYMENT.md
services:
  - type: web
    name: exp-reimb-agent
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: EXTRACTION_MODE
        value: offline              # public demo: no Anthropic key needed or consumed
      - key: DATA_DIR
        value: /tmp/expense-agent   # free instances have an ephemeral filesystem
      - key: REFERENCE_DATE
        value: "2026-10-07"         # keeps the September 2026 demo receipts deterministic
      - key: OFFLINE_PROCESSING_DELAY
        value: "0.9"
      - key: WORKER_THREADS
        value: "2"                  # free plan: 0.1 CPU / 512 MB
      # Live Claude extraction is opt-in and configured in the Render dashboard, never here:
      # add ANTHROPIC_API_KEY as a secret environment variable and set EXTRACTION_MODE=auto.
